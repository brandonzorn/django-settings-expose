[project]
name = "django-settings-expose"
version = "0.1.0"
description = "Fast, cached Django settings exporter to templates."
readme = "README.md"
requires-python = ">=3.9, <=3.14"
license = {text = "MIT"}
authors = [
    {name = "Vladimir Klimenko", email = "v.klimenko.2137@gmail.com"}
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "Django>=3.2,<=5.2",
]

[project.urls]
"Repository" = "https://github.com/brandonzorn/django-settings-expose"
"Bug Tracker" = "https://github.com/brandonzorn/django-settings-expose/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"